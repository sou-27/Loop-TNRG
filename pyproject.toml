[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loop_tnrg"
version = "0.1.0"
description = "Loop optimised Tensor Network Renormalization Group"
requires-python = ">=3.10"
authors = [
    { name = "Soumil Roychowdhury", email = "soumilroychowdhury9@gmail.com" }
]
dependencies = [
    "numpy",
    "scipy",
    "h5py",
    "ncon"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0"
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]